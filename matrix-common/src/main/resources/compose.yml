networks:
  minecraft:
    name: 'minecraft'
    external: true

services:
  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    hostname: mongodb
    container_name: mongodb
    restart: always
    ports:
    - "127.0.0.1:27017:27017"
    volumes:
    - /var/data/mongodb/:/data
    environment:
    - 'MONGO_INITDB_ROOT_USERNAME=matrix'
    - 'MONGO_INITDB_ROOT_PASSWORD=m4trix.4dm1n'
    networks:
    - minecraft
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    restart: always
    ports:
    - "127.0.0.1:6379:6379"
    command: redis-server --save 300 10 --loglevel warning
    networks:
    - minecraft
  mariadb:
    image: mariadb:10
    hostname: mariadb
    container_name: mariadb
    restart: always
    ports:
    - "127.0.0.1:3306:3306"
    volumes:
    - /var/data/mariadb/:/var/lib/mysql
    environment:
    - 'MARIADB_ROOT_PASSWORD=p4ng0l1no'
    networks:
    - minecraft
    command:
    - '--max_connections=10000'
    #- '--innodb_buffer_pool_size=10G'
  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    ports:
    - "127.0.0.1:5672:5672"
    - "127.0.0.1:15672:15672"
    networks:
    - minecraft
    environment:
    - 'RABBITMQ_DEFAULT_USER=matrix'
    - 'RABBITMQ_DEFAULT_PASS=m4trix.4dm1n'
    volumes:
    - /var/data/rabbitmq/:/var/lib/rabbitmq
